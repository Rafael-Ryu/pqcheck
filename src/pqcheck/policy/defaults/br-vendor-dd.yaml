apiVersion: pqcheck.cryptoct.com/v1
kind: CryptoPolicy
metadata:
  name: br-vendor-dd
  version: 0.1.0
  publisher: CryptoCT
  applies-to: >-
    Advisory profile for vendor due-diligence annexes: produces a
    severity-ranked cryptographic inventory a supplier can attach to
    onboarding questionnaires (acquirers, correspondent banking, card
    schemes). Findings inform the annex; nothing gates. Aligned with the
    vendor-assessment practice around Res. CMN 4.893/2021 — not required by
    any current regulation.
  effective-from: "2026-06-11"
  review-date: "2026-12-11"
spec:
  default-action: warn
  approved:
    - { family: kem, algorithm: ML-KEM, parameter-sets: ["768", "1024"], action: allow }
    - { family: signature, algorithm: ML-DSA, parameter-sets: ["65", "87"], action: allow }
    - { family: signature, algorithm: SLH-DSA, parameter-sets: ["SHA2-128s"], action: allow }
    - { family: symmetric-cipher, algorithm: AES, parameter-sets: ["256"], modes: ["GCM"], action: allow }
    - { family: hash, algorithm: SHA-256, action: allow }
    - { family: hash, algorithm: SHA-384, action: allow, preferred: true }
    - { family: mac, algorithm: HMAC, hash: ["SHA-256", "SHA-384"], action: allow }
    - { family: kdf, algorithm: HKDF, hash: ["SHA-256"], action: allow }
    - family: kdf
      algorithm: Argon2id
      params: { memory-kib-min: 131072, iterations-min: 4, parallelism-min: 1 }
      action: allow
  banned:
    - { family: asymmetric-encryption, algorithm: RSA, action: warn, severity: critical, reason: "Shor-vulnerable — flag in annex with migration plan" }
    - { family: signature, algorithm: ECDSA, action: warn, severity: critical, reason: "Shor-vulnerable — flag in annex with migration plan" }
    - { family: signature, algorithm: EdDSA, curves: ["Ed25519", "Ed448"], action: warn, severity: critical }
    - { family: key-agreement, algorithm: DH, action: warn, severity: critical }
    - { family: key-agreement, algorithm: ECDH, action: warn, severity: critical }
    - { family: hash, algorithm: MD5, action: warn, severity: critical, reason: "Collision-broken" }
    - { family: hash, algorithm: SHA-1, action: warn, severity: critical, reason: "Collision-broken" }
    - { family: symmetric-cipher, algorithm: DES, action: warn, severity: critical }
    - { family: symmetric-cipher, algorithm: 3DES, action: warn, severity: critical }
    - { family: symmetric-cipher, algorithm: RC4, action: warn, severity: critical }
    - { family: hash, algorithm: RIPEMD-160, action: warn, severity: high, reason: "Legacy 160-bit hash" }
    - { family: symmetric-cipher, algorithm: Blowfish, action: warn, severity: critical, reason: "64-bit block (Sweet32-class)" }
    - { family: symmetric-cipher, algorithm: IDEA, action: warn, severity: critical, reason: "64-bit block (Sweet32-class)" }
    - family: symmetric-cipher
      algorithm: AES
      parameter-sets: ["128"]
      action: warn
      severity: high
      reason: "AES-128 has only 64-bit post-Grover security margin."
    - family: symmetric-cipher
      algorithm: AES
      modes: ["ECB", "CBC", "CFB", "OFB"]
      action: warn
      severity: medium
      reason: "Non-AEAD mode"
  severity-rules:
    - { confidence-band: high, action: as-declared }
    - { confidence-band: medium, action: demote-one-tier }
    - { confidence-band: low, action: demote-two-tiers }
