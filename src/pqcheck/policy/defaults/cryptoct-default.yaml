apiVersion: pqcheck.cryptoct.com/v1
kind: CryptoPolicy
metadata:
  name: cryptoct-default
  version: 1.0.0
  publisher: CryptoCT
  applies-to: "All new code in CryptoCT-controlled repositories"
  effective-from: "2026-05-22"
  review-date: "2026-11-22"
spec:
  default-action: warn
  approved:
    - { family: kem, algorithm: ML-KEM, parameter-sets: ["768", "1024"], action: allow }
    # Hybrid classical+PQC KEMs (crypto/tls Go 1.24+, circl hpke): a
    # classical component alongside a PQC one, HYBRID not SAFE on the
    # quantum-risk axis (models._QUANTUM_MAP) -- but the best available
    # TLS key-agreement posture today, so approved here rather than
    # falling to the default warn action.
    - { family: kem, algorithm: X25519MLKEM768, action: allow }
    - { family: kem, algorithm: X-WING, action: allow }
    - { family: kem, algorithm: X25519KYBER768-DRAFT, action: allow }
    - { family: signature, algorithm: ML-DSA, parameter-sets: ["65", "87"], action: allow }
    - { family: signature, algorithm: SLH-DSA, parameter-sets: ["SHA2-128s"], action: allow }
    - { family: symmetric-cipher, algorithm: AES, parameter-sets: ["256"], modes: ["GCM"], action: allow }
    - { family: hash, algorithm: SHA-256, action: allow }
    - { family: hash, algorithm: SHA-384, action: allow, preferred: true }
    - { family: mac, algorithm: HMAC, hash: ["SHA-256", "SHA-384"], action: allow }
    - { family: kdf, algorithm: HKDF, hash: ["SHA-256"], action: allow }
    # Detector canonical is "ARGON2" (nacl.pwhash argon2id/argon2i both
    # collapse to it, matching AES not carrying its mode) — match on that,
    # not the FIPS/RFC display name "Argon2id", or approved findings never
    # match (02 SS2.5 approves Argon2 for password hashing).
    - family: kdf
      algorithm: ARGON2
      params: { memory-kib-min: 131072, iterations-min: 4, parallelism-min: 1 }
      action: allow
  banned:
    - { family: asymmetric-encryption, algorithm: RSA, action: fail, severity: critical, reason: "Shor — migrate to ML-KEM-768" }
    - { family: asymmetric-encryption, algorithm: RSA, paddings: ["PKCS1v15", "OAEP-SHA1"], action: fail, severity: critical, reason: "RSA-PKCS1v1.5 / RSA-OAEP-SHA1 padding — independently broken (Bleichenbacher / SHA-1) on top of Shor" }
    - { family: signature, algorithm: ECDSA, action: fail, severity: critical, reason: "Shor — migrate to ML-DSA-65" }
    - { family: signature, algorithm: EdDSA, curves: ["Ed25519", "Ed448"], action: fail, severity: critical }
    - { family: key-agreement, algorithm: DH, action: fail, severity: critical }
    - { family: key-agreement, algorithm: ECDH, action: fail, severity: critical }
    - { family: hash, algorithm: MD5, action: fail, severity: critical, reason: "Collision-broken" }
    - { family: hash, algorithm: SHA-1, action: fail, severity: critical, reason: "Collision-broken" }
    - { family: symmetric-cipher, algorithm: DES, action: fail, severity: critical }
    - { family: symmetric-cipher, algorithm: 3DES, action: fail, severity: critical }
    - { family: symmetric-cipher, algorithm: RC4, action: fail, severity: critical }
    - { family: hash, algorithm: RIPEMD-160, action: fail, severity: high, reason: "Legacy 160-bit hash — banned by policy §3" }
    - { family: symmetric-cipher, algorithm: Blowfish, action: fail, severity: critical, reason: "64-bit block (Sweet32-class)" }
    - { family: symmetric-cipher, algorithm: IDEA, action: fail, severity: critical, reason: "64-bit block (Sweet32-class)" }
    - family: symmetric-cipher
      algorithm: AES
      parameter-sets: ["128"]
      action: fail
      severity: high
      reason: "AES-128 has only 64-bit post-Grover security margin. Use AES-256 in new code."
    - family: symmetric-cipher
      algorithm: AES
      modes: ["ECB", "CBC", "CFB", "OFB"]
      action: warn
      severity: medium
    - { family: rng, algorithm: MATH-RAND, action: warn, severity: medium, reason: "math/rand (incl. rand/v2) is not cryptographically secure — use crypto/rand where randomness feeds key material, nonces, or tokens" }
    - { family: protocol, algorithm: TLS-1.0, action: fail, severity: critical, reason: "Deprecated by RFC 8996 — no supported use remains" }
    - { family: protocol, algorithm: TLS-1.1, action: fail, severity: critical, reason: "Deprecated by RFC 8996 — no supported use remains" }
    - { family: protocol, algorithm: SSL-3.0, action: fail, severity: critical, reason: "Deprecated by RFC 8996 — no supported use remains" }
    - { family: protocol, algorithm: TLS-RSA-KX, action: fail, severity: high, reason: "Static RSA key exchange — no forward secrecy" }
  exceptions:
    - id: EXC-001
      description: "GitHub App JWT requires RS256 per GitHub upstream limitation"
      banned-algorithm: RSA
      context: github-app-jwt
      adr: docs/adr/004-github-app-jwt.md
      review-date: "2026-09-30"
      compensating-controls:
        - "TLS PQC outer"
        - "ML-DSA-65 signature on PR comment payload (Phase 3)"
        - "Webhook nonce + timestamp window 5min for anti-replay"
    - id: EXC-002
      description: "Verify-only Stripe webhook signatures (HMAC-SHA-256 upstream)"
      banned-algorithm: null
      context: stripe-webhook-verify
      adr: docs/adr/007-stripe-webhook.md
      review-date: "2027-01-15"
      compensating-controls:
        - "Idempotency: (provider, provider_event_id) UNIQUE"
        - "Nonce + timestamp window"
  severity-rules:
    - { confidence-band: high, action: as-declared }
    - { confidence-band: medium, action: demote-one-tier }
    - { confidence-band: low, action: demote-two-tiers }
