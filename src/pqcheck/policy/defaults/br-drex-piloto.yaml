apiVersion: pqcheck.cryptoct.com/v1
kind: CryptoPolicy
metadata:
  name: br-drex-piloto
  version: 0.1.0
  publisher: CryptoCT
  applies-to: >-
    Forward-looking profile anticipating crypto-agility expectations for
    tokenized-settlement infrastructure (Drex-style). The Drex pilot platform
    was discontinued in Nov 2025 and no PQC requirement for participants
    exists today — this is the strictest profile for teams that want new code
    quantum-safe by construction, not a compliance obligation.
  effective-from: "2026-06-11"
  review-date: "2026-12-11"
spec:
  default-action: fail
  approved:
    - { family: kem, algorithm: ML-KEM, parameter-sets: ["768", "1024"], action: allow }
    - { family: signature, algorithm: ML-DSA, parameter-sets: ["65", "87"], action: allow }
    - { family: signature, algorithm: SLH-DSA, parameter-sets: ["SHA2-128s"], action: allow }
    - { family: symmetric-cipher, algorithm: AES, parameter-sets: ["256"], modes: ["GCM"], action: allow }
    - { family: hash, algorithm: SHA-256, action: allow }
    - { family: hash, algorithm: SHA-384, action: allow, preferred: true }
    - { family: mac, algorithm: HMAC, hash: ["SHA-256", "SHA-384"], action: allow }
    - { family: kdf, algorithm: HKDF, hash: ["SHA-256"], action: allow }
    # Detector canonical is "ARGON2" (nacl.pwhash argon2id/argon2i both
    # collapse to it, matching AES not carrying its mode) — match on that,
    # not the FIPS/RFC display name "Argon2id", or approved findings never
    # match (02 SS2.5 approves Argon2 for password hashing).
    - family: kdf
      algorithm: ARGON2
      params: { memory-kib-min: 131072, iterations-min: 4, parallelism-min: 1 }
      action: allow
  banned:
    - { family: asymmetric-encryption, algorithm: RSA, action: fail, severity: critical, reason: "Shor-vulnerable — migrate to ML-KEM-768" }
    - { family: asymmetric-encryption, algorithm: RSA, paddings: ["PKCS1v15", "OAEP-SHA1"], action: fail, severity: critical, reason: "RSA-PKCS1v1.5 / RSA-OAEP-SHA1 padding — independently broken (Bleichenbacher / SHA-1) on top of Shor" }
    - { family: signature, algorithm: ECDSA, action: fail, severity: critical, reason: "Shor-vulnerable — migrate to ML-DSA-65" }
    - { family: signature, algorithm: EdDSA, curves: ["Ed25519", "Ed448"], action: fail, severity: critical }
    - { family: key-agreement, algorithm: DH, action: fail, severity: critical }
    - { family: key-agreement, algorithm: ECDH, action: fail, severity: critical }
    - { family: key-agreement, algorithm: X25519, action: fail, severity: critical, reason: "Classical-only key agreement; hybrid X25519MLKEM768 detection lands with usage-context support" }
    - { family: key-agreement, algorithm: X448, action: fail, severity: critical, reason: "Classical-only key agreement; hybrid detection lands with usage-context support" }
    - { family: hash, algorithm: MD5, action: fail, severity: critical, reason: "Collision-broken" }
    - { family: hash, algorithm: SHA-1, action: fail, severity: critical, reason: "Collision-broken" }
    - { family: symmetric-cipher, algorithm: DES, action: fail, severity: critical }
    - { family: symmetric-cipher, algorithm: 3DES, action: fail, severity: critical }
    - { family: symmetric-cipher, algorithm: RC4, action: fail, severity: critical }
    - { family: hash, algorithm: RIPEMD-160, action: fail, severity: high, reason: "Legacy 160-bit hash" }
    - { family: symmetric-cipher, algorithm: Blowfish, action: fail, severity: critical, reason: "64-bit block (Sweet32-class)" }
    - { family: symmetric-cipher, algorithm: IDEA, action: fail, severity: critical, reason: "64-bit block (Sweet32-class)" }
    - family: symmetric-cipher
      algorithm: AES
      parameter-sets: ["128"]
      action: fail
      severity: high
      reason: "AES-128 has only 64-bit post-Grover security margin. Use AES-256."
    - family: symmetric-cipher
      algorithm: AES
      modes: ["ECB", "CBC", "CFB", "OFB"]
      action: fail
      severity: medium
      reason: "Non-AEAD mode — use AES-256-GCM"
    - { family: rng, algorithm: MATH-RAND, action: fail, severity: medium, reason: "math/rand (incl. rand/v2) is not cryptographically secure — use crypto/rand where randomness feeds key material, nonces, or tokens" }
  severity-rules:
    - { confidence-band: high, action: as-declared }
    - { confidence-band: medium, action: demote-one-tier }
    - { confidence-band: low, action: demote-two-tiers }
