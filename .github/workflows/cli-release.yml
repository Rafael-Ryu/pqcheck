name: CLI Release

on:
  push:
    tags: ["pqcheck-v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wheels:
    name: Wheels (${{ matrix.cibw_archs }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # One native runner per target arch, so the bundled Go binary is compiled
      # natively (no cross-compile). GOOS/GOARCH are passed through to the
      # cibuildwheel before-build via CIBW_ENVIRONMENT.
      matrix:
        include:
          - os: ubuntu-latest
            cibw_archs: x86_64
            cibw_environment: "GOOS=linux GOARCH=amd64 PATH=/usr/local/go/bin:$PATH"
          - os: macos-13
            cibw_archs: x86_64
            cibw_environment: "GOOS=darwin GOARCH=amd64"
          - os: macos-14
            cibw_archs: arm64
            cibw_environment: "GOOS=darwin GOARCH=arm64"
          - os: windows-latest
            cibw_archs: AMD64
            cibw_environment: "GOOS=windows GOARCH=amd64"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25"
          cache-dependency-path: tools/crypto-analyzer/go.sum
      - uses: pypa/cibuildwheel@8d2b08b68458a16aeb24b64e68a09ab1c8e82084 # v3.4.1
        env:
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          CIBW_ENVIRONMENT: ${{ matrix.cibw_environment }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.cibw_archs }}
          path: wheelhouse/*.whl

  release:
    needs: wheels
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write # Sigstore keyless (Fulcio) + PyPI trusted publishing
      contents: write # create the GitHub release
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      # Publish first, while dist/ holds only wheels; signing adds .sigstore
      # bundles that PyPI must not receive.
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist/
          attestations: true
      - name: Sign wheels with Sigstore (keyless)
        uses: sigstore/gh-action-sigstore-python@04cffa1d795717b140764e8b640de88853c92acc # v3.3.0
        with:
          inputs: ./dist/*.whl
      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: dist/*
