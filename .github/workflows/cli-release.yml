name: CLI Release

on:
  push:
    tags: ["pqcheck-v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The branch CI (ci.yml) is the only place go vet/test run, and it triggers on
  # push/PR to main/develop — never on the pqcheck-v* tag that drives a release.
  # Gate the wheels on the same Go checks here so a tag cannot publish a binary
  # that never passed vet/test.
  go-test:
    name: Go vet + test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/crypto-analyzer
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25.0"
          cache-dependency-path: tools/crypto-analyzer/go.sum
      - run: go generate ./...
      - run: GOTOOLCHAIN=local go vet -mod=readonly ./...
      - run: GOTOOLCHAIN=local go test -mod=readonly -race ./...

  wheels:
    name: Wheels (${{ matrix.cibw_archs }} on ${{ matrix.os }})
    needs: go-test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # One native runner per target arch, so the bundled Go binary is compiled
      # natively (no cross-compile). GOOS/GOARCH are passed through to the
      # cibuildwheel before-build via CIBW_ENVIRONMENT.
      matrix:
        include:
          - os: ubuntu-latest
            cibw_archs: x86_64
            cibw_environment: "GOOS=linux GOARCH=amd64 PATH=/usr/local/go/bin:$PATH"
          - os: macos-13
            cibw_archs: x86_64
            cibw_environment: "GOOS=darwin GOARCH=amd64"
          - os: macos-14
            cibw_archs: arm64
            cibw_environment: "GOOS=darwin GOARCH=arm64"
          - os: windows-latest
            cibw_archs: AMD64
            cibw_environment: "GOOS=windows GOARCH=amd64"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          # Exact pin so macOS/Windows wheels build with the same toolchain as the
          # Linux container's curl'd go1.25.0 (cibuildwheel before-all), keeping
          # the bundled binary reproducible across targets.
          go-version: "1.25.0"
          cache-dependency-path: tools/crypto-analyzer/go.sum
      - uses: pypa/cibuildwheel@8d2b08b68458a16aeb24b64e68a09ab1c8e82084 # v3.4.1
        env:
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          CIBW_ENVIRONMENT: ${{ matrix.cibw_environment }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Run the bundled analyzer on its native runner before publish: a wrong-arch,
      # non-executable, or hash-mismatched binary would otherwise reach PyPI and
      # silently degrade users to tree-sitter (the never-raise contract hides it).
      # `pqcheck --help` alone never enters the analyzer; this drives the bridge
      # through the real SHA-256 pin over a real module. `go` is on PATH (setup-go).
      - name: Smoke-test the bundled analyzer on its native wheel
        shell: bash
        run: |
          whl=$(ls wheelhouse/*.whl | head -1)
          python -m venv .smoke
          venv_py=.smoke/bin/python
          [ -f "$venv_py" ] || venv_py=.smoke/Scripts/python
          "$venv_py" -m pip install --quiet "$whl"
          "$venv_py" tools/ci/smoke_bundled_analyzer.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.cibw_archs }}
          path: wheelhouse/*.whl

  release:
    needs: wheels
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write # Sigstore keyless (Fulcio) + PyPI trusted publishing
      contents: write # create the GitHub release
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Verify wheel contents
        run: |
          uvx twine check dist/*.whl
          for whl in dist/*.whl; do
            unzip -l "$whl" | grep -qE 'pqcheck/bin/[^/]+/crypto-analyzer(\.exe)?$' \
              || { echo "missing binary in $whl"; exit 1; }
            unzip -l "$whl" | grep -q 'pqcheck/data/crypto-catalog.json' \
              || { echo "missing catalog in $whl"; exit 1; }
            # The SHA-256 pin (hatch_build.py) is skipped silently if the binary
            # is absent at hook time; without it the runtime can't verify the
            # bundled binary and falls back to tree-sitter on every scan.
            unzip -l "$whl" | grep -q 'pqcheck/detectors/_constants.py' \
              || { echo "missing SHA-256 pin (_constants.py) in $whl"; exit 1; }
          done
      - name: Smoke-test the linux wheel
        # The ubuntu runner can only install the linux wheel; running the entry
        # point catches a broken import or console-script before users do.
        run: |
          linux_whl=""
          for whl in dist/*.whl; do
            if unzip -l "$whl" | grep -q 'pqcheck/bin/linux-amd64/crypto-analyzer'; then
              linux_whl="$whl"; break
            fi
          done
          [ -n "$linux_whl" ] || { echo "no linux wheel to smoke-test"; exit 1; }
          uv run --no-project --with "$linux_whl" pqcheck --help
      # Publish first, while dist/ holds only wheels; signing adds .sigstore
      # bundles that PyPI must not receive.
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist/
          attestations: true
      - name: Sign wheels with Sigstore (keyless)
        uses: sigstore/gh-action-sigstore-python@04cffa1d795717b140764e8b640de88853c92acc # v3.3.0
        with:
          inputs: ./dist/*.whl
      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: dist/*
