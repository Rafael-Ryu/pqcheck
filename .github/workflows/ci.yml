name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - run: uv run ruff check .
      - run: uv run mypy

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/crypto-analyzer
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          # Exact pin (not "1.25") so vet/test run the same toolchain the release
          # wheels are built with. go.mod requires 1.25.0; mlkem needs 1.24+.
          go-version: "1.25.0"
          cache-dependency-path: tools/crypto-analyzer/go.sum
      # go:generate copies the single-source catalog in for //go:embed; the
      # package will not compile (vet/test included) without it.
      - run: go generate ./...
      - run: go vet -mod=readonly ./...
      - run: go test -mod=readonly -race ./...

  test:
    needs: lint-type
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - run: uv run pytest
      - name: Validate emitted CBOM against the official CycloneDX 1.6 schema
        run: |
          uv run pqcheck scan tests/fixtures/python --policy cryptoct-default \
            --format cbom -o /tmp/ci-cbom.cdx.json || test $? -eq 1
          uv run python -m pqcheck.cbom.validator /tmp/ci-cbom.cdx.json
      - name: Self-audit (release gate — pqcheck must pass its own policy)
        run: uv run pqcheck self-audit . -o /tmp/self-cbom.json

  sarif:
    # Dogfood the SARIF writer against GitHub Code Scanning — an import
    # failure here means downstream consumers would reject our output.
    needs: lint-type
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - name: Scan self to SARIF
        run: |
          uv run pqcheck scan . --policy cryptoct-default \
            --format sarif -o /tmp/pqcheck.sarif || test $? -eq 1
      - uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          sarif_file: /tmp/pqcheck.sarif
          category: pqcheck-self-scan

  build:
    needs: [test, go]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25.0"
          cache-dependency-path: tools/crypto-analyzer/go.sum
      # Build the bundled binary so the wheel is the real shippable artifact:
      # the hatch hook then pins its SHA-256 and force-includes _constants.py.
      # -buildvcs=false matches the release build (pyproject before-build) so the
      # binary is reproducible and carries no commit/dirty-tree stamp.
      - name: Build the bundled crypto-analyzer
        working-directory: tools/crypto-analyzer
        run: |
          GOTOOLCHAIN=local go generate ./...
          CGO_ENABLED=0 GOTOOLCHAIN=local go build -mod=readonly -trimpath -buildvcs=false -ldflags=-buildid= \
            -o "../../src/pqcheck/bin/$(go env GOOS)-$(go env GOARCH)/crypto-analyzer" \
            ./cmd/crypto-analyzer
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      # Build the wheel directly from source: plain `uv build` derives the wheel
      # from the sdist, which omits the gitignored binary. Building the wheel
      # straight from the tree keeps the bundled artifact, and a missing data-file
      # include (schemas/*, policy/defaults/*.yaml) would only surface here.
      - run: uv build --wheel
      - run: uvx twine check dist/*
      - name: Assert the wheel bundles the binary, catalog, and SHA-256 pin
        run: |
          for pat in \
            "pqcheck/bin/linux-amd64/crypto-analyzer" \
            "pqcheck/data/crypto-catalog.json" \
            "pqcheck/detectors/_constants.py"; do
            unzip -l dist/*.whl | grep -qE "$pat" || { echo "missing $pat in wheel"; exit 1; }
          done
      - run: uv run --no-project --with dist/*.whl pqcheck --help
